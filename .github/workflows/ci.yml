name: Continues Integration
on:
  #push:
  workflow_dispatch:
jobs:
  prcheck:
    runs-on: ubuntu-latest
    steps:       
      - name: Checkout ujp005devops
        uses: actions/checkout@v7

      - name: Git branch
        run: "git branch"

      - name: List files
        run: |
          ls -al ${{ github.workspace }}

      - name: Set up JDK 17 #21
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Java version
        run: "java -version"
          
      - name: Maven version
        run: "mvn -version"

      - name: Build war
        run: 'mvn package -DskipTests'

      - name: Run tests and save logs
        id: test
        run: |
          mvn test | tee test-log.txt
        continue-on-error: true

      - name: Print logs
        run: "cat test-log.txt"

      - name: Check Test Running
        run: |
          # Check if the specific string is in the output
          if ! grep -q "Running com.softserve.unit.ContactServiceTest" test-log.txt; then
              echo "Test suite did not run."
              exit 1
          else
              echo "Test suite ran successfully."
          fi

      - name: Check for Failure
        run: |
          if grep -q "FAILURE!" test-log.txt; then
            echo "A test has failed."
            exit 1
          fi

      - name: Check Test Result
        run: |
          if ! grep -q "Tests run: 4, Failures: 0, Errors: 0, Skipped: 0" test-log.txt; then
            echo "Test results do not match expected values."
            exit 1
          fi

      - name: Save test logs
        uses: actions/upload-artifact@v7
        with:
          name: test-log
          path: test-log.txt

      - name: Copy results to the remote host over SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          source: "target/dev.war"
          target: "/home/azureuser/"
          strip_components: 1

name: Continues Integration
on:
  push:
  workflow_dispatch:
jobs:
  prcheck:
    runs-on: ubuntu-latest
    steps:       
      - name: Checkout ujp005devops
        uses: actions/checkout@v7

      - name: List files
        run: |
          ls -al ${{ github.workspace }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          
      - name: Java version
        run: "java -version"
          
      - name: Maven version
        run: "mvn -version"
